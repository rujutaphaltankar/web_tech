<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            text-align: center;
            padding: 40px 15px;
        }

        .dashboard {
            background: white;
            max-width: 420px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        input, button {
            padding: 10px;
            margin: 6px;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <h1>Weather Dashboard</h1>

        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name"
        >

        <button id="searchBtn">Get Weather</button>

        <div id="output" aria-live="polite">
            Enter a city to view its weather.
        </div>
    </div>

    <!-- Original JavaScript version -->
    <script src="dist/weather.js"></script>
</body>
</html>
