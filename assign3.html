<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout</title>

    <style>
        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background: #222;
                color: white;
            }
        }

        /* Grid Layout */
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";

            grid-template-columns: 1fr 3fr;
            gap: 10px;
        }

        header, aside, main, footer {
            padding: 20px;
            background: lightgray;
        }

        header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        aside {
            grid-area: sidebar;
        }

        main {
            grid-area: content;
        }

        footer {
            grid-area: footer;
            text-align: center;
        }

        /* Responsive Layout */
        @media (max-width: 600px) {
            .container {
                grid-template-areas:
                    "header"
                    "content"
                    "sidebar"
                    "footer";

                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h2>My Website</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <aside>
            <h3>Sidebar</h3>
            <p>Dashboard</p>
            <p>Profile</p>
        </aside>

        <main>
            <h2>Main Content</h2>
            <p>Welcome to my website.</p>
        </main>

        <footer>
            Copyright 2026
        </footer>

    </div>

</body>
</html>
