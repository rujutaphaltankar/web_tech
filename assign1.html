<!DOCTYPE html>
<html>
<head>
    <title>Web Technology Assignment 1</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 10px;
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <p id="msg">This is my first practical.</p>

    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            document.getElementById("msg").innerHTML = "Welcome to Web Technology!";
        }
    </script>

</body>
</html>
